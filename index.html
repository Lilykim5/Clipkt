<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clipkt - Home</title>
    <style>
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        /* Container that smoothly shifts upward when the drawer opens */
        .page-container {
            margin-top: 150px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), margin-top 0.4s ease;
        }

        .page-container.shifted {
            margin-top: 60px; /* Pulls Clipkt and text upward */
        }

        h1 {
            font-size: 52px;
            font-weight: 800;
            color: #111827;
            margin: 0 0 16px 0;
            letter-spacing: -0.5px;
        }

        .top-text {
            font-size: 22px;
            color: #374151;
            margin-bottom: 8px;
        }

        .bottom-text {
            font-size: 17px;
            color: #6b7280;
            margin-bottom: 32px;
        }

        /* Auth Choice Buttons */
        .auth-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .action-btn {
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s ease-in-out;
        }

        .btn-login {
            color: #333333;
            border: 1px solid #d1d5db;
            background-color: #ffffff;
        }

        .btn-login:hover, .btn-login.active-toggle {
            background-color: #f3f4f6;
            border-color: #9ca3af;
        }

        .btn-signup {
            color: #ffffff;
            border: 1px solid #007bff;
            background-color: #007bff;
        }

        .btn-signup:hover, .btn-signup.active-toggle {
            background-color: #0056b3;
        }

        /* Slide-down Drawer Panel (like the dashboard pull-down) */
        .auth-drawer {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            display: flex;
            justify-content: center;
        }

        .auth-drawer.open {
            max-height: 420px;
            opacity: 1;
        }

        /* Card interior styling */
        .auth-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            width: 90%;
            max-width: 360px;
            padding: 26px 28px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
            text-align: left;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .drawer-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #111827;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 22px;
            color: #9ca3af;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .close-btn:hover {
            color: #111827;
        }

        /* Input styling */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #3eb489;
        }

        /* Mint Confirm Submit Button */
        .confirm-btn {
            width: 100%;
            padding: 12px;
            background-color: #3eb489;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .confirm-btn:hover {
            background-color: #359f77;
        }
    </style>
</head>
<body>

    <div class="page-container" id="page-container">
        <h1>Clipkt</h1>
        <div class="top-text">A website dedicated to quick and easy video editing</div>
        <div class="bottom-text">I dont know javascript :D</div>

        <div class="auth-actions">
            <button type="button" class="action-btn btn-login" id="btn-login">Log In</button>
            <button type="button" class="action-btn btn-signup" id="btn-signup">Sign Up</button>
        </div>

        <!-- Sliding Box Container -->
        <div class="auth-drawer" id="auth-drawer">
            <div class="auth-card">
                <div class="card-header">
                    <h3 class="drawer-title" id="drawer-heading">Log In</h3>
                    <button type="button" class="close-btn" id="drawer-close">&times;</button>
                </div>
                
                <form action="dashboard.html" method="GET">
                    <div class="input-group">
                        <label id="lbl-username">Username</label>
                        <input type="text" name="user" required>
                    </div>
                    
                    <div class="input-group">
                        <label id="lbl-password">Password</label>
                        <input type="password" name="pass" required>
                    </div>

                    <button type="submit" class="confirm-btn">Confirm</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('page-container');
        const drawer = document.getElementById('auth-drawer');
        const heading = document.getElementById('drawer-heading');
        const lblUser = document.getElementById('lbl-username');
        const lblPass = document.getElementById('lbl-password');
        const closeBtn = document.getElementById('drawer-close');
        const btnLogin = document.getElementById('btn-login');
        const btnSignup = document.getElementById('btn-signup');

        let currentMode = null;

        function openDrawer(mode) {
            container.classList.add('shifted');
            drawer.classList.add('open');
            currentMode = mode;

            if (mode === 'login') {
                heading.textContent = 'Log In';
                lblUser.textContent = 'Username';
                lblPass.textContent = 'Password';
                btnLogin.classList.add('active-toggle');
                btnSignup.classList.remove('active-toggle');
            } else {
                heading.textContent = 'Sign Up';
                lblUser.textContent = 'Create Username';
                lblPass.textContent = 'Create Password';
                btnSignup.classList.add('active-toggle');
                btnLogin.classList.remove('active-toggle');
            }
        }

        function closeDrawer() {
            container.classList.remove('shifted');
            drawer.classList.remove('open');
            btnLogin.classList.remove('active-toggle');
            btnSignup.classList.remove('active-toggle');
            currentMode = null;
        }

        btnLogin.addEventListener('click', () => {
            if (drawer.classList.contains('open') && currentMode === 'login') {
                closeDrawer();
            } else {
                openDrawer('login');
            }
        });

        btnSignup.addEventListener('click', () => {
            if (drawer.classList.contains('open') && currentMode === 'signup') {
                closeDrawer();
            } else {
                openDrawer('signup');
            }
        });

        closeBtn.addEventListener('click', closeDrawer);
    </script>

</body>
</html>
