<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clipkt - Home</title>
    <style>
        body {
            background-color: white;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .hero {
            margin-top: 140px;
        }

        h1 {
            font-size: 48px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 16px;
        }

        .top-text {
            font-size: 22px;
            color: #374151;
            margin-bottom: 8px;
        }

        .bottom-text {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 36px;
        }

        /* Centered buttons row */
        .auth-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .action-btn {
            text-decoration: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.2s ease-in-out;
        }

        .btn-login {
            color: #333333;
            border: 1px solid #d1d5db;
            background-color: #ffffff;
        }

        .btn-login:hover {
            background-color: #f3f4f6;
        }

        .btn-signup {
            color: #ffffff;
            border: 1px solid #007bff;
            background-color: #007bff;
        }

        .btn-signup:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <main class="hero">
        <h1>Clipkt</h1>
        <div class="top-text">A website dedicated to quick and easy video editing</div>
        <div class="bottom-text">I dont know javascript :D</div>

        <!-- Auth buttons centered in the middle -->
        <div class="auth-actions">
            <a href="login.html" class="action-btn btn-login">Log In</a>
            <a href="signup.html" class="action-btn btn-signup">Sign Up</a>
        </div>
    </main>

</body>
</html>
